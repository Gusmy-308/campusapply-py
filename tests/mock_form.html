<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>模拟网申表单</title>
<style>body{font-family:sans-serif;padding:20px;max-width:700px}
.form-item{margin:12px 0}label{display:block;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;padding:6px;box-sizing:border-box}</style></head>
<body>
<h2>2027届校园招聘 · 应聘登记表</h2>
<form>
  <div class="form-item"><label for="name">姓名</label><input id="name" name="name" required></div>
  <div class="form-item"><label for="gender">性别</label>
    <select id="gender" name="gender"><option value="">请选择</option><option>男</option><option>女</option></select></div>
  <div class="form-item"><label for="phone">手机号码</label><input id="phone" name="phone" type="tel" required></div>
  <div class="form-item"><label for="email">电子邮箱</label><input id="email" name="email" type="email"></div>
  <div class="form-item"><label for="school">毕业院校</label><input id="school" name="school" required></div>
  <div class="form-item"><label for="major">所学专业</label><input id="major" name="major"></div>
  <div class="form-item"><label for="gpa">学分绩</label><input id="gpa" name="gpa"></div>
  <div class="form-item"><label for="degree">最高学历</label>
    <select id="degree" name="degree"><option value="">请选择</option><option>本科</option><option>硕士</option><option>博士</option></select></div>
  <div class="form-item"><label for="selfintro">自我评价</label><textarea id="selfintro" name="selfintro" rows="3"></textarea></div>
  <div class="form-item"><label for="captcha">验证码</label><input id="captcha" name="captcha"></div>
  <button type="submit">提交</button>
</form>
</body></html>
